<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goddess Intro</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer; /* 整個畫面都可點 */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 點擊時短暫閃爍反饋 */
    .video-container:active {
      opacity: 0.9;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>
  <div class="video-container" id="videoContainer">
    <video id="goddessVideo" preload="auto" muted playsinline>
      <source src="Comp.mp4" type="video/mp4">
      
    </video>
  </div>

  <script>
    const video = document.getElementById("goddessVideo");
    const container = document.getElementById("videoContainer");

    // 預先載入影片第一幀
    video.addEventListener("loadeddata", () => {
      video.pause();
      video.currentTime = 0;
    });

    // 點擊整個畫面播放影片
    container.addEventListener("click", () => {
      container.style.cursor = "default"; // 播放後移除手勢
      video.play();
    }, { once: true }); // 防止重複點擊

    // 播放完自動跳頁
    video.addEventListener("ended", () => {
      window.location.href = "HomePage.html"; // 改成你的主頁名稱
    });
  </script>
</body>
</html>
