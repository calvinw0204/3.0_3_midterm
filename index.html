<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goddess Intro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    /* 影片容器，填滿整個螢幕 */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      overflow: hidden;
      z-index: 1;
    }

    /* 影片拉滿螢幕 */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* 完全拉滿 */
      display: block;
    }

    /* 彈幕容器，覆蓋影片上方 */
    #danmuContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 不阻擋點擊 */
      z-index: 2;
    }

    /* 彈幕樣式 */
    .danmu {
      position: absolute;
      white-space: nowrap;
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
      animation: fly linear forwards;
      opacity: 1;
    }

    @keyframes fly {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100vw); }
    }
  </style>
</head>
<body>

  <!-- 影片容器 -->
  <div class="video-container" id="videoContainer">
    <video id="goddessVideo" preload="auto" muted playsinline>
      <source src="Comp2.mov" type="video/mp4">
    </video>
  </div>

  <!-- 彈幕 -->
  <div id="danmuContainer"></div>

  <script>
    const video = document.getElementById("goddessVideo");
    const container = document.getElementById("videoContainer");
    const containerDanmu = document.getElementById("danmuContainer");
    const words = [
      "星光閃耀✨",
      "Welcome to StarLightAR",
      "香港電影之光🎬",
      "Collect your rewards!",
      "Enjoy the night🌙"
    ];

    // 預先載入影片第一幀
    video.addEventListener("loadeddata", () => {
      video.pause();
      video.currentTime = 0;
    });

    // 點擊整個畫面播放影片
    container.addEventListener("click", () => {
      container.style.cursor = "default"; // 播放後移除手勢
      video.play();
    }, { once: true });

    // 播放完自動跳頁
    video.addEventListener("ended", () => {
      window.location.href = "HomePage.html";
    });

    // 彈幕生成
    setInterval(() => {
      const d = document.createElement("div");
      d.className = "danmu";
      d.innerText = words[Math.floor(Math.random() * words.length)];
      d.style.top = Math.random() * window.innerHeight * 0.8 + "px";
      d.style.animationDuration = (6 + Math.random() * 5) + "s";
      containerDanmu.appendChild(d);

      // 彈幕淡出後移除
      setTimeout(() => {
        d.style.opacity = "0";
        setTimeout(() => d.remove(), 1000);
      }, 9000);
    }, 1000);
  </script>
</body>
</html>
